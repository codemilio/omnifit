[project]
name = "omnifit"
version = "0.1.0"
description = "Bot de rotina pessoal no Telegram com dashboard web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "alembic>=1.20,<2",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.32,<1",
    "fastapi>=0.162,<1",
    "groq>=1.7,<2",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.16,<3",
    "sqlmodel>=0.0.48,<0.1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
